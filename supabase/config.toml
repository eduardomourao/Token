# Local-only Supabase CLI configuration.
# Deliberately no project_id: this repository does not select a remote project.

[api]
enabled = true
# Keep application-private schemas out of the browser-facing API surface.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# The foundation carries no seed or real application data.
enabled = false
sql_paths = []
