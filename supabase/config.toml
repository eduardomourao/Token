# Local-only Supabase CLI configuration.
# Deliberately no project_id: this repository does not select a remote project.

[api]
enabled = true
# Keep application-private schemas out of the browser-facing API surface.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# The foundation carries no seed or real application data.
enabled = false
sql_paths = []

[auth]
# Production uses the stable Vercel alias; the wildcard permits preview-based
# magic-link validation without widening redirects beyond this Vercel team.
site_url = "https://token-usage-monitor.vercel.app"
additional_redirect_urls = [
  "https://token-usage-monitor.vercel.app/**",
  "https://*-stiflerwfl1-oss-projects.vercel.app/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# Personal dashboard: creation with e-mail/password starts a session immediately.
# The hosted project is updated from this source configuration via `supabase config push`.
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[storage.vector]
enabled = false

[functions.collect-gemini-usage]
enabled = true
verify_jwt = false
import_map = "./functions/collect-gemini-usage/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/collect-gemini-usage/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/collect-gemini-usage/*.html" ]

[functions.collect-opencode-go-usage]
enabled = true
verify_jwt = false
import_map = "./functions/collect-opencode-go-usage/deno.json"
entrypoint = "./functions/collect-opencode-go-usage/index.ts"

[functions.proxy-responses]
enabled = true
verify_jwt = false
import_map = "./functions/proxy-responses/deno.json"
entrypoint = "./functions/proxy-responses/index.ts"

[functions.refresh-proxy-usage]
enabled = true
verify_jwt = false
import_map = "./functions/refresh-proxy-usage/deno.json"
entrypoint = "./functions/refresh-proxy-usage/index.ts"
