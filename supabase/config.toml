# Local-only Supabase CLI configuration.
# Deliberately no project_id: this repository does not select a remote project.

[api]
enabled = true
# Keep application-private schemas out of the browser-facing API surface.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# The foundation carries no seed or real application data.
enabled = false
sql_paths = []

[functions.collect-gemini-usage]
enabled = true
verify_jwt = false
import_map = "./functions/collect-gemini-usage/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/collect-gemini-usage/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/collect-gemini-usage/*.html" ]
